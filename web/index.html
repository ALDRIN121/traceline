<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 17.5 9 6l3.5 7 1.5-3 6 7.5'/%3E%3C/svg%3E">
<title>Evaluation Engine — Run dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 17.5 9 6l3.5 7 1.5-3 6 7.5"/>
        <path d="M4 21h16"/>
      </svg>
      <span class="brand-name">Evaluation Engine</span>
      <span class="brand-sub">LLM agent evaluation</span>
    </div>
    <div class="topbar-controls">
      <div class="run-filter" id="run-filter">
        <label for="run-select" class="filter-label">Run</label>
        <select id="run-select" class="run-select" disabled aria-describedby="run-select-hint"></select>
        <span id="run-select-hint" class="visually-hidden">Choose the run the dashboard shows. Latest resolves to the most recent run.</span>
      </div>
      <button id="refresh-btn" class="btn btn-secondary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 3v6h-6"/>
        </svg>
        <span>Refresh</span>
      </button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="main">
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="boot" class="boot">
    <div class="boot-dot" aria-hidden="true"></div>
    <p>Loading dashboard…</p>
  </div>
  <div id="fatal" class="fatal" hidden>
    <h1 class="fatal-title">The dashboard could not load</h1>
    <p id="fatal-detail" class="fatal-detail"></p>
    <button id="fatal-retry" class="btn btn-secondary" type="button">Try again</button>
  </div>
</main>

<footer class="footer">
  <span id="footer-meta"></span>
  <span class="footer-health"><span id="health-dot" class="dot" aria-hidden="true"></span><span id="health-text">API —</span></span>
</footer>

<noscript>
  <div class="noscript">
    <p>This dashboard renders from the evaluation engine's API and needs JavaScript enabled.
    The API contract itself is available at <code>/api/dashboards/default</code> and <code>/runs</code>.</p>
  </div>
</noscript>
</body>
</html>
