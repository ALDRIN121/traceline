services:
  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eval_db
      POSTGRES_USER: eval_maint
      POSTGRES_PASSWORD: ${POSTGRES_MAINT_PASSWORD:?set POSTGRES_MAINT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval_maint -d eval_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "llm_agent_eval.bootstrap_postgres"]
    environment:
      DATABASE_URL: "postgresql://eval_maint:${POSTGRES_MAINT_PASSWORD:?set POSTGRES_MAINT_PASSWORD in .env}@postgres:5432/eval_db"
      LLM_AGENT_EVAL_APP_DB_USER: eval_app
      LLM_AGENT_EVAL_APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  eval-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: &engine-environment
      DATABASE_URL: "postgresql://eval_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/eval_db"
      LLM_AGENT_EVAL_DB: "postgresql://eval_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/eval_db"
      LLM_AGENT_EVAL_ARTIFACT_ROOT: "/var/lib/llm-agent-eval"
      LLM_AGENT_EVAL_MODEL_PROVIDER: ${LLM_AGENT_EVAL_MODEL_PROVIDER:-deepseek}
      LLM_AGENT_EVAL_MODEL_BASE_URL: ${LLM_AGENT_EVAL_MODEL_BASE_URL:-https://api.deepseek.com}
      LLM_AGENT_EVAL_MODEL: ${LLM_AGENT_EVAL_MODEL:-deepseek-v4-flash}
      LLM_AGENT_EVAL_MODEL_API_KEY: ${LLM_AGENT_EVAL_MODEL_API_KEY:-}
      LLM_AGENT_EVAL_MODEL_API_VERSION: ${LLM_AGENT_EVAL_MODEL_API_VERSION:-}
      LLM_AGENT_EVAL_MODEL_ALLOW_KEYLESS: ${LLM_AGENT_EVAL_MODEL_ALLOW_KEYLESS:-false}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      - eval_artifacts:/var/lib/llm-agent-eval
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Workflow jobs only. This image has no Podman socket or agent execution path;
  # enabling sandbox evaluation needs a separately constrained runtime topology.
  eval-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["eval-engine", "worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      <<: *engine-environment
      LLM_AGENT_EVAL_SERVICE_IDENTITY: proxy
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      # Artifacts, fingerprint/secret keys, and future install CA survive restarts.
      - eval_artifacts:/var/lib/llm-agent-eval
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -r /var/lib/llm-agent-eval"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  eval_pgdata:
  eval_artifacts:
