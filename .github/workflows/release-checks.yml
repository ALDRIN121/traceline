name: Release checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-smoke:
    name: Offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked offline test environment
        run: |
          python -m pip install uv==0.8.22
          uv pip sync --system requirements-dev.lock
          uv pip install --system --no-deps -e .
      - name: Run platform-compatible offline suite
        # PostgreSQL, Podman and provider tests remain in their dedicated jobs;
        # this matrix catches client/runtime regressions on every supported OS.
        run: python -m pytest -m 'not live and not integration' -ra

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eval_test
          POSTGRES_USER: eval_test
          # Disposable CI service only; never a deployment credential.
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval_test -d eval_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eval_test:disposable-ci-password@127.0.0.1:5432/eval_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test environment
        run: |
          python -m pip install uv==0.8.22
          uv venv .venv --python 3.12
          uv pip sync --python .venv/bin/python requirements-dev.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Check Compose structure without loading deployment secrets
        env:
          POSTGRES_MAINT_PASSWORD: disposable-config-password
          POSTGRES_APP_PASSWORD: disposable-config-app-password
        run: docker compose config --quiet
      - name: Offline suite and disposable PostgreSQL integration
        # Provider and live Podman tests are not release evidence from this job.
        run: .venv/bin/python -m pytest -m 'not live' -ra

  compose-rehearsal:
    name: Disposable Compose deployment rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test environment
        run: |
          python -m pip install uv==0.8.22
          uv pip sync --system requirements-dev.lock
          uv pip install --system --no-deps -e .
      - name: Rehearse generated-credential Compose deployment
        env:
          LLM_AGENT_EVAL_RUN_COMPOSE: '1'
        run: python -m pytest -q -o addopts='' tests/integration/test_compose_rehearsal.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --disable-pip --no-deps --requirement requirements.lock

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history with redacted output
        run: >-
          docker run --rm --network=none
          --volume "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3
          git /repo --redact --no-banner
